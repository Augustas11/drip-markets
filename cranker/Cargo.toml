[package]
name = "drip"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
default-run = "drip"

[lib]
name = "drip"
path = "src/lib.rs"

[[bin]]
name = "drip"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
# Match the wrapper's engine pin exactly — otherwise two `percolator` crates
# get linked into the graph with mismatched types. Our wrapper fork
# (scripts/pins.env) pins our engine fork `605a89a2` (master 80f8f0b4 + #172 SettleB fix).
percolator = { git = "https://github.com/Augustas11/percolator", rev = "605a89a2a06064fb66f8b4bd35ed6842ff4e72b1" }
percolator-prog = { path = "../upstream/percolator-prog" }
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
litesvm = "0.1"
