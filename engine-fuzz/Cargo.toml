[package]
name = "engine-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shadow-ledger money fuzzer for the Percolator v16 engine"

[dependencies]
# Production pin: same rev as upstream/percolator-prog/Cargo.toml. run.sh master patches this to a local checkout.
percolator = { git = "https://github.com/Augustas11/percolator", rev = "605a89a2a06064fb66f8b4bd35ed6842ff4e72b1" }

[dev-dependencies]
proptest = "1.4"

# Same release flags the engine uses for its own tests.
[profile.release]
opt-level = 3
overflow-checks = true
